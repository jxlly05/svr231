name: Server Start - Fast - Low Ping

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-runner-region-and-start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Steuerdatei prüfen
      - name: Check artifact control file
        id: control
        run: |
          URL="https://raw.githubusercontent.com/jxlly05/svr231/refs/heads/main/minecraft_server/artifact-version-id.txt"

          echo "Prüfe Datei: $URL"

          if curl -f -s "$URL" -o control.txt; then
            VALUE=$(tr -d '\r\n ' < control.txt)

            echo "Datei gefunden: [$VALUE]"

            if [ "$VALUE" = "none" ]; then
              echo "artifact_state=none" >> $GITHUB_OUTPUT
            else
              echo "artifact_state=exists" >> $GITHUB_OUTPUT
              echo "artifact_id=$VALUE" >> $GITHUB_OUTPUT
            fi
          else
            echo "Datei existiert nicht → erstelle none"
            echo "none" > control.txt
            echo "artifact_state=none" >> $GITHUB_OUTPUT
          fi

      # 2. Artifact laden (wenn vorhanden)
      - name: Try download artifact
        if: steps.control.outputs.artifact_state == 'exists'
        uses: actions/download-artifact@v4
        with:
          name: minecraft-server
          path: minecraft_server
        continue-on-error: true

      # 3. Fallback: Repo klonen
      - name: Fallback to git clone
        if: steps.control.outputs.artifact_state != 'exists'
        run: |
          echo "Kein gültiges Artifact → klone Repository"
          git config --global protocol.version 2
          git clone --depth 1 https://github.com/jxlly05/svr231.git .

      # 4. Java installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 5. Server + Autosave
      - name: Start AutoSave & Minecraft Server
        run: |
          echo "[Autosave] Starte Hintergrundprozess..."

          {
            while true; do
              cd "$GITHUB_WORKSPACE"

              # während Laufzeit immer auf "none" setzen
              echo "none" > minecraft_server/artifact-version-id.txt

              git config user.name "github-actions"
              git config user.email "github-actions@github.com"

              git add minecraft_server || true
              git commit -m "Autosave" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true

              echo "[Autosave] gespeichert"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!

          cd minecraft_server

          java -Xms14G -Xmx14G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:+AlwaysPreTouch \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -XX:G1MixedGCCountTarget=4 \
          -XX:InitiatingHeapOccupancyPercent=15 \
          -XX:G1MixedGCLiveThresholdPercent=90 \
          -XX:G1RSetUpdatingPauseTimePercent=5 \
          -XX:SurvivorRatio=32 \
          -XX:+PerfDisableSharedMem \
          -XX:MaxTenuringThreshold=1 \
          -Dusing.aikars.flags=https://mcflags.emc.gs \
          -Daikars.new.flags=true \
          -jar paper.jar --nogui

          echo "[Autosave] Stoppe Hintergrundprozess..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true

      # 6. Artifact hochladen
      - name: Upload Minecraft Server Artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server
          path: minecraft_server

      # 7. Artifact-ID in Datei schreiben
      - name: Write artifact ID to file
        run: |
          echo "${{ steps.upload.outputs.artifact-id }}" > minecraft_server/artifact-version-id.txt

      # 8. Finaler Push
      - name: Final push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add minecraft_server
          git commit -m "Final state" || echo "No changes"
          git push origin HEAD:main --force
