name: Server Start - Fast - Low Ping

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Repo auschecken (WICHTIG!)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Steuerdatei prüfen
      - name: Check artifact control file
        id: control
        run: |
          FILE="minecraft_server/artifact-version-id.txt"

          echo "Prüfe Datei: $FILE"

          if [ -f "$FILE" ]; then
            VALUE=$(tr -d '\r\n ' < "$FILE")
            echo "Datei gefunden: [$VALUE]"

            if [ "$VALUE" = "none" ]; then
              echo "artifact_state=none" >> $GITHUB_OUTPUT
            else
              echo "artifact_state=exists" >> $GITHUB_OUTPUT
              echo "artifact_id=$VALUE" >> $GITHUB_OUTPUT
            fi
          else
            echo "Datei existiert nicht"
            echo "artifact_state=none" >> $GITHUB_OUTPUT
          fi

      # 3. Artifact laden
      - name: Download artifact
        if: steps.control.outputs.artifact_state == 'exists'
        uses: actions/download-artifact@v4
        with:
          name: minecraft-server
          path: minecraft_server
        continue-on-error: true

      # 4. Fallback: KEIN git clone!
      - name: Fallback setup
        if: steps.control.outputs.artifact_state != 'exists'
        run: |
          echo "Kein Artifact → verwende Repo-Stand (kein clone nötig)"

      # 5. Java installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 6. Server starten + Autosave
      - name: Start Server + Autosave
        run: |
          echo "Starte Autosave..."

          {
            while true; do
              echo "none" > minecraft_server/artifact-version-id.txt

              git config user.name "github-actions"
              git config user.email "github-actions@github.com"

              git add minecraft_server || true
              git commit -m "Autosave" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true

              echo "Autosave done"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!

          cd minecraft_server

          java -Xms14G -Xmx14G -jar paper.jar --nogui

          kill "$AUTOSAVE_PID" 2>/dev/null || true

      # 7. Artifact hochladen
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server
          path: minecraft_server

      # 8. Artifact-ID speichern
      - name: Write artifact id
        run: |
          echo "${{ steps.upload.outputs.artifact-id }}" > minecraft_server/artifact-version-id.txt

      # 9. Push Änderungen
      - name: Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add minecraft_server
          git commit -m "Update state" || echo "No changes"
          git push origin HEAD:main
