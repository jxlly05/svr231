name: Server Start - Fast - Low Ping

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-runner-region-and-start-server:
    runs-on: ubuntu-latest
    steps:
      - name: Detect runner region
        id: region
        run: |
          IP=$(curl -s https://api.ipify.org)
          echo IP: $IP

          REGION_RAW=$(curl -s "https://ipinfo.io/$IP/region")
          echo "Detected region raw: $REGION_RAW"

          # Prüfen ob 429 drin vorkommt → Rate limit
          if echo "$REGION_RAW" | grep -q "429"; then
            echo "rate_limited=true" >> $GITHUB_OUTPUT
          else
            echo "rate_limited=false" >> $GITHUB_OUTPUT
          fi

          # Region normal setzen (nur für Vergleich)
          echo "region=$REGION_RAW" >> $GITHUB_OUTPUT

      - name: Restart workflow if region not Virginia OR rate limited (429)
        # Bedingung:
        # - region != 'Virginia'
        # - ODER rate_limited == true
        if: ${{ steps.region.outputs.region != 'Virginia' || steps.region.outputs.rate_limited == 'true' }}
        env:
          GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}
          WORKFLOW_FILE: server.yml
        run: |
          echo "❌ Runner not in Virginia OR 429 rate limit detected — restarting workflow via PAT..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$WORKFLOW_FILE/dispatches \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          exit 1
      
      # 1. Repository auschecken – initial nur Kern-Dateien & eine Welt laden
      - name: Clone repo with progress
        run: |
          git config --global protocol.version 2
          GIT_TERMINAL_PROMPT=1 \
          git clone --depth 1 --progress https://github.com/jxlly05/svr231.git .
          
      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. RAM & Festplattenplatz prüfen
      - name: Check system memory and disk space
        run: |
          echo "==== RAM ===="
          free -h
          echo ""
          echo "==== Festplattenplatz auf Runner ===="
          df -h /
          
      # 4. Autosave + Minecraft Server Start
      - name: Start AutoSave & Minecraft Server
        run: |
          echo "[Autosave] Starte Hintergrund-Autosave-Prozess..."

          # Autosave-Prozess im Hintergrund starten und PID merken
          {
            while true; do
              cd "$GITHUB_WORKSPACE"
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"

              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/svr231.git
        
              git add minecraft_server || true
              git commit -m "Autosave | Minecraft Server" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true
        
              echo "[Autosave] Repo save done"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!
        
          echo "[Autosave] Hintergrundprozess gestartet mit PID $AUTOSAVE_PID"
        
          # Minecraft-Server starten
          cd "$GITHUB_WORKSPACE/minecraft_server"
          java -Xms14G -Xmx14G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -jar paper.jar --nogui
        
          # Sobald der Serverprozess endet, Autosave stoppen
          echo "[Autosave] beende Autosave-Prozess..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true
        
          echo "[Autosave] Autosave vollständig gestoppt."
          
      # 5. Finaler Commit/PUSH
      - name: Force-push server data to repo
        run: |
          sleep 10
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/svr231.git
      
          [ -f ".git/index.lock" ] && rm -f .git/index.lock
      
          # Nur Minecraft-Server-Daten committen
          git add minecraft_server
          # Sicherstellen, dass .github/ nicht gestaged ist
          git reset HEAD .github || true
      
          git commit -m "Finaler Push | Minecraft Server" || echo "No changes to commit"
      
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "[Autosave] (Versuch $attempt/$max_attempts) Versuche, Änderungen zu pushen..."
            if git push origin HEAD:main --force; then
              echo "[Autosave] Push erfolgreich!"
              break
            else
              if [ $attempt -eq $max_attempts ]; then
                echo "[Autosave] Push nach $max_attempts Versuchen fehlgeschlagen. Breche ab."
                exit 1
              fi
              echo "[Autosave] Push fehlgeschlagen, warte 10 Sekunden und versuche erneut..."
              sleep 10
            fi
            attempt=$((attempt + 1))
          done

