name: Server Start - Fast - Low Ping

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-runner-region-and-start-server:
    runs-on: ubuntu-latest

    steps:
      # 1. Artifact laden (falls vorhanden)
      - name: Download Server Artifact
        id: download_artifact
        uses: actions/download-artifact@v4
        with:
          name: minecraft-server
          path: minecraft_server
        continue-on-error: true

      # 2. Fallback auf Git Clone, falls Artifact nicht existiert
      - name: Check and fallback to git clone
        run: |
          if [ ! -d "minecraft_server" ] || [ -z "$(ls -A minecraft_server 2>/dev/null)" ]; then
            echo "Artifact nicht vorhanden → Repository wird geklont"
            git config --global protocol.version 2
            git clone --depth 1 --progress https://github.com/jxlly05/svr231.git .
          else
            echo "Artifact erfolgreich geladen"
          fi

      # 3. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 4. Autosave + Minecraft Server Start
      - name: Start AutoSave & Minecraft Server
        run: |
          echo "[Autosave] Starte Hintergrund-Autosave-Prozess..."

          {
            while true; do
              cd "$GITHUB_WORKSPACE"
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"

              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/svr231.git

              git add minecraft_server || true
              git commit -m "Autosave | Minecraft Server" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true

              echo "[Autosave] Repo save done"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!

          echo "[Autosave] Hintergrundprozess gestartet mit PID $AUTOSAVE_PID"

          cd "$GITHUB_WORKSPACE/minecraft_server"

          java -Xms14G -Xmx14G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:+AlwaysPreTouch \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -XX:G1MixedGCCountTarget=4 \
          -XX:InitiatingHeapOccupancyPercent=15 \
          -XX:G1MixedGCLiveThresholdPercent=90 \
          -XX:G1RSetUpdatingPauseTimePercent=5 \
          -XX:SurvivorRatio=32 \
          -XX:+PerfDisableSharedMem \
          -XX:MaxTenuringThreshold=1 \
          -Dusing.aikars.flags=https://mcflags.emc.gs \
          -Daikars.new.flags=true \
          -jar paper.jar --nogui

          echo "[Autosave] beende Autosave-Prozess..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true

          echo "[Autosave] Autosave vollständig gestoppt."

      # 5. Finaler Commit/PUSH
      - name: Force-push server data to repo
        run: |
          sleep 10
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/svr231.git

          [ -f ".git/index.lock" ] && rm -f .git/index.lock

          git add minecraft_server
          git reset HEAD .github || true

          git commit -m "Finaler Push | Minecraft Server" || echo "No changes to commit"

          max_attempts=3
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "[Autosave] (Versuch $attempt/$max_attempts) Versuche, Änderungen zu pushen..."
            if git push origin HEAD:main --force; then
              echo "[Autosave] Push erfolgreich!"
              break
            else
              if [ $attempt -eq $max_attempts ]; then
                echo "[Autosave] Push nach $max_attempts Versuchen fehlgeschlagen."
                exit 1
              fi
              sleep 10
            fi
            attempt=$((attempt + 1))
          done

      # 6. Artifact hochladen
      - name: Upload Minecraft Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server
          path: minecraft_server
