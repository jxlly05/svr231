name: Fast Server Start (Github Artifacts)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read # Wird für den gh api Download benötigt

jobs:
  start:
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.set-time.outputs.start_time }}
    steps:
      - id: set-time
        run: echo "start_time=$(date -u +%s)" >> $GITHUB_OUTPUT

  check-runner-region-and-start-server:
    needs: start
    runs-on: ubuntu-latest
    steps:
      - name: Detect runner region
        id: region
        run: |
          set -e
    
          IP=$(curl -s https://api.ipify.org)
          echo "IP: $IP"
    
          RESPONSE=$(curl -s "https://ipinfo.io/$IP/region" || true)
          echo "Raw response: $RESPONSE"
    
          # Default-Werte
          REGION="unknown"
          RATE_LIMITED="false"
    
          # Prüfen auf Rate Limit oder ungültige Antwort
          if echo "$RESPONSE" | grep -q "429"; then
            RATE_LIMITED="true"
          elif echo "$RESPONSE" | grep -q "{"; then
            # JSON → vermutlich Fehlerantwort
            RATE_LIMITED="true"
          elif [ -z "$RESPONSE" ]; then
            RATE_LIMITED="true"
          else
            REGION="$RESPONSE"
          fi
    
          echo "Parsed region: $REGION"
          echo "Rate limited: $RATE_LIMITED"
    
          # NUR saubere Werte in GITHUB_OUTPUT schreiben
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "rate_limited=$RATE_LIMITED" >> "$GITHUB_OUTPUT"
  
          
      - name: Restart workflow if region not Virginia OR rate limited
        if: ${{ steps.region.outputs.region != 'Virginia' || steps.region.outputs.rate_limited == 'true' }}
        env:
          GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}
          WORKFLOW_FILE: server.yml
        run: |
          echo "❌ Runner not in Virginia OR rate limit detected — restarting workflow..."
    
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_PAT" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$WORKFLOW_FILE/dispatches \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
    
          echo "Workflow restart triggered. Exiting current run."
          exit 1
    
      # 1. Datei prüfen und bedingt Klonen oder Artefakt laden
      - name: Check Artifact Status and Prepare Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[Init] Prüfe artifact-version-id.txt via URL..."
          URL="https://raw.githubusercontent.com/jxlly05/svr231/refs/heads/main/minecraft_server/artifact-version-id.txt"
          
          # Wir speichern die Datei in /tmp/, damit das Arbeitsverzeichnis für Git komplett leer bleibt
          HTTP_STATUS=$(curl -s -o /tmp/remote_id.txt -w "%{http_code}" "$URL")
          ARTIFACT_ID="none"
          
          if [ "$HTTP_STATUS" == "200" ]; then
            # Lese Inhalt und entferne eventuelle Zeilenumbrüche
            ARTIFACT_ID=$(cat /tmp/remote_id.txt | tr -d '\r' | tr -d '\n')
          fi
          
          if [ "$ARTIFACT_ID" == "none" ] || [ -z "$ARTIFACT_ID" ]; then
            echo "[Init] Status ist 'none' oder URL nicht erreichbar. Klone das gesamte Repository..."
            git config --global protocol.version 2
            
            # Klonen in einen temporären Ordner und dann verschieben, um den "already exists" Fehler sicher zu umgehen
            GIT_TERMINAL_PROMPT=1 \
            git clone --depth 1 --progress https://github.com/jxlly05/svr231.git temp_repo
            
            # dotglob sorgt dafür, dass auch versteckte Dateien wie .git und .github verschoben werden
            shopt -s dotglob
            mv temp_repo/* .
            rm -rf temp_repo
            shopt -u dotglob
            
            # Fallback, falls die Datei komplett gefehlt hat
            mkdir -p minecraft_server
            echo "none" > minecraft_server/artifact-version-id.txt
          else
            echo "[Init] Artifact ID gefunden: $ARTIFACT_ID. Überspringe kompletten Repo-Clone."
            
            # --- SCHNELLE GIT-INITIALISIERUNG ---
            echo "[Init] Lade Git-Struktur extrem schnell (ohne Dateiinhalte)..."
            git clone --depth 1 --filter=blob:none --no-checkout https://github.com/jxlly05/svr231.git .
            
            echo "[Init] Stelle nur den .github Ordner wieder her..."
            git checkout HEAD -- .github
            # ------------------------------------
            
            echo "[Init] Lade Artefakt herunter..."
            mkdir -p minecraft_server
            gh api "/repos/jxlly05/svr231/actions/artifacts/$ARTIFACT_ID/zip" > server_data.zip
            
            if [ -s server_data.zip ]; then
              unzip -q server_data.zip -d minecraft_server/
              rm server_data.zip
              echo "[Init] Server-Daten aus Artefakt erfolgreich wiederhergestellt."
            else
              echo "[Init] FEHLER beim Artefakt-Download! Fallback: Klone das Repo..."
              git clone --depth 1 https://github.com/jxlly05/svr231.git temp_repo
              shopt -s dotglob
              mv temp_repo/* .
              rm -rf temp_repo
              shopt -u dotglob
              echo "none" > minecraft_server/artifact-version-id.txt
            fi
          fi

          
      # 2. Java 21 installieren
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. Autosave + Minecraft Server Start
      - name: Start AutoSave & Minecraft Server
        run: |
          echo "[Autosave] Starte Hintergrund-Autosave-Prozess..."

          {
            while true; do
              cd "$GITHUB_WORKSPACE"
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/svr231.git
              
              # Während der Server läuft, steht immer 'none' in der Datei
              echo "none" > minecraft_server/artifact-version-id.txt
        
              git add minecraft_server || true
              git commit -m "Autosave | Minecraft Server" >/dev/null 2>&1 || true
              git push origin HEAD:main --force >/dev/null 2>&1 || true
        
              echo "[Autosave] Repo save done"
              sleep 60
            done
          } &
          AUTOSAVE_PID=$!
          echo "[Autosave] Hintergrundprozess gestartet mit PID $AUTOSAVE_PID"




          {
            echo "[World-DL] Prüfe auf fehlende Welten..."
          
            # Liste aller benötigten Welten
            WORLDS=("flatworld" "Island" "Luebeck" "Survival" "Survival_nether" "Survival_the_end")
            MISSING_WORLDS=()
          
            # 1. Herausfinden, was überhaupt fehlt
            for WORLD in "${WORLDS[@]}"; do
              if [ ! -d "$GITHUB_WORKSPACE/minecraft_server/$WORLD" ]; then
                MISSING_WORLDS+=("$WORLD")
              else
                echo "[World-DL] Welt '$WORLD' existiert bereits. Wird übersprungen."
              fi
            done
          
            # 2. Nur wenn wirklich etwas fehlt, wird Git angeworfen
            if [ ${#MISSING_WORLDS[@]} -gt 0 ]; then
              echo "[World-DL] Fehlende Welten gefunden: ${MISSING_WORLDS[*]}. Starte gebündelten Download..."
            
              TEMP_DIR=$(mktemp -d)
              cd "$TEMP_DIR"
            
              # Repo-Struktur in unter 1 Sekunde laden (ohne Dateiinhalte)
              git clone --depth 1 --filter=blob:none --sparse https://github.com/jxlly05/svr231.git .
            
              # Sparse-Checkout Liste für Git zusammenbauen
              SPARSE_PATHS=()
              for WORLD in "${MISSING_WORLDS[@]}"; do
                SPARSE_PATHS+=("minecraft_server/$WORLD/")
              done
            
              # Git sagen: "Lade NUR diese spezifischen Welten-Ordner herunter!"
              git sparse-checkout set "${SPARSE_PATHS[@]}"
            
              # 3. Heruntergeladene Welten in den echten Server-Ordner schieben
              for WORLD in "${MISSING_WORLDS[@]}"; do
                if [ -d "minecraft_server/$WORLD" ]; then
                  mv "minecraft_server/$WORLD" "$GITHUB_WORKSPACE/minecraft_server/"
                  echo "[World-DL] Welt '$WORLD' wurde erfolgreich heruntergeladen und bereitgestellt."
                else
                  echo "[World-DL] FEHLER: Welt '$WORLD' konnte im Repository nicht gefunden werden."
                fi
              done
            
              # Aufräumen
              cd "$GITHUB_WORKSPACE"
              rm -rf "$TEMP_DIR"
              echo "[World-DL] Download und Bereitstellung abgeschlossen."
            else
              echo "[World-DL] Alle Welten sind bereits vorhanden. Kein Download nötig."
            fi
          } &
          


          
          # In Server-Verzeichnis wechseln
          cd "$GITHUB_WORKSPACE/minecraft_server"
          
          # Pipe erstellen für Server-Input
          mkfifo mcpipe
          
          # Minecraft-Server im Hintergrund starten
          java -Xms14G -Xmx14G \
          -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch \
          -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 \
          -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 \
          -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 \
          -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 \
          -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true \
          -jar paper.jar --nogui < mcpipe &
          
          SERVER_PID=$!
          
          # Pipe dauerhaft offen halten
          exec 3>mcpipe
          
          # Gesamtzeit: 5,5 Stunden = 19800 Sekunden
          TOTAL_TIME=19800
          
          # Countdown im Hintergrund
          {
            for ((i=TOTAL_TIME; i>=1; i--)); do
              
              # Nur in den letzten 30 Sekunden Nachrichten senden
              if [ $i -le 30 ]; then
                echo "say Server wird in $i Sekunden neugestartet" >&3
              fi
          
              sleep 1
            done
          
            echo "say Starte Server neu..." >&3
            echo "stop" >&3
          } &
          
          # Warten bis Server beendet ist
          wait $SERVER_PID
          
          # Cleanup
          echo "[Autosave] beende Autosave-Prozess..."
          kill "$AUTOSAVE_PID" 2>/dev/null || true
          echo "[Autosave] Autosave vollständig gestoppt."

      # 4. Artefakt erstellen
      - name: Upload Server Artifact
        id: server_upload
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-data-${{ github.run_id }}
          path: |
            minecraft_server/
            !minecraft_server/flatworld
            !minecraft_server/Island
            !minecraft_server/Luebeck
            !minecraft_server/Survival
            !minecraft_server/Survival_nether
            !minecraft_server/Survival_the_end
          retention-days: 90

      # 5. Finale ID in Datei schreiben und pushen
      - name: Save Artifact ID and Force-push
        run: |
          sleep 5
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jxlly05/svr231.git
       
          [ -f ".git/index.lock" ] && rm -f .git/index.lock
       
          NEW_ARTIFACT_ID="${{ steps.server_upload.outputs.artifact-id }}"
          echo "[Final Push] Schreibe neue Artifact-ID in Datei: $NEW_ARTIFACT_ID"
          echo "$NEW_ARTIFACT_ID" > minecraft_server/artifact-version-id.txt
       
          git add minecraft_server
          git reset HEAD .github || true
       
          git commit -m "Finaler Push | Artifact ID: $NEW_ARTIFACT_ID" || echo "No changes to commit"
       
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "[Final Push] (Versuch $attempt/$max_attempts) Versuche, Änderungen zu pushen..."
            if git push origin HEAD:main --force; then
              echo "[Final Push] Push erfolgreich!"
              break
            else
              if [ $attempt -eq $max_attempts ]; then
                echo "[Final Push] Push fehlgeschlagen. Breche ab."
                exit 1
              fi
              echo "[Final Push] Push fehlgeschlagen, warte 10 Sekunden..."
              sleep 10
            fi
            attempt=$((attempt + 1))
          done

      - name: Restart workflow after 5h 25m
        if: ${{ success() }}
        env:
          START_TIME: ${{ needs.start.outputs.start_time }}
          GITHUB_PAT: ${{ secrets.MY_GITHUB_PAT }}
          WORKFLOW_FILE: server.yml
        run: |
          echo "Startzeit (UTC Epoch): $START_TIME"

          NOW=$(date -u +%s)
          ELAPSED=$((NOW - START_TIME))

          LIMIT=19500

          echo "Vergangene Zeit: $ELAPSED Sekunden"

          if [ "$ELAPSED" -ge "$LIMIT" ]; then
            echo "🔁 Restart nötig"

            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_PAT" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$WORKFLOW_FILE/dispatches \
              -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          fi
